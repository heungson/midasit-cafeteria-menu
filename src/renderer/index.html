<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>오늘의 메뉴</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="title">
        <div id="date" class="date">오늘의 메뉴</div>
        <div id="subtitle" class="subtitle"></div>
      </div>
      <div class="actions">
        <button id="refresh" class="icon" title="새로고침" aria-label="새로고침">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.76-4.24M16 3.5V7h-3.5" /></svg>
        </button>
        <button id="openSettings" class="icon" title="설정" aria-label="설정">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6" /><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" /></svg>
        </button>
      </div>
    </header>

    <section id="menuView" class="view">
      <nav id="days" class="days" aria-label="요일 선택"></nav>
      <div id="banner" class="banner" hidden></div>
      <div id="meals" class="meals"></div>
    </section>

    <section id="settingsView" class="view settings" hidden>
      <div class="settings-head">
        <button id="closeSettings" class="link">← 메뉴로</button>
        <h2>설정</h2>
      </div>

      <div class="group">
        <h3>그룹웨어 계정</h3>
        <p id="accountState" class="hint"></p>
        <form id="accountForm" autocomplete="off">
          <label>아이디(이메일 주소)<input id="username" type="text" spellcheck="false" autocapitalize="off" /></label>
          <label>비밀번호<input id="password" type="password" /></label>
          <div class="row">
            <button type="submit" class="primary">저장</button>
            <button type="button" id="clearAccount" class="ghost">삭제</button>
          </div>
        </form>
        <p id="storeHint" class="hint small"></p>
      </div>

      <div class="group">
        <h3>접속 프로필</h3>
        <p id="profileState" class="hint"></p>
        <div class="row">
          <button id="importProfile" class="ghost">프로필 파일 가져오기…</button>
          <button id="openData" class="ghost">데이터 폴더 열기</button>
        </div>
      </div>

      <div class="group">
        <h3>메뉴 이미지 인식</h3>
        <label class="check"><input id="claudeEnabled" type="checkbox" /> Claude Code CLI로 인식(권장)</label>
        <p id="claudeState" class="hint small"></p>
        <label>모델
          <select id="claudeModel">
            <option value="sonnet">sonnet (권장)</option>
            <option value="haiku">haiku (빠름)</option>
            <option value="opus">opus</option>
          </select>
        </label>
        <label class="check"><input id="crossCheck" type="checkbox" /> 기본 OCR로 결과 대조</label>
        <p id="nativeState" class="hint small"></p>
      </div>

      <div class="group">
        <h3>일반</h3>
        <label class="check"><input id="openAtLogin" type="checkbox" /> 로그인 시 자동 실행</label>
        <label>확인 간격(분)<input id="refreshMinutes" type="number" min="10" max="240" step="5" /></label>
      </div>

      <div class="row end">
        <span id="version" class="hint small"></span>
        <button id="quit" class="ghost danger">앱 종료</button>
      </div>
    </section>

    <footer id="footer" class="footer"></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
